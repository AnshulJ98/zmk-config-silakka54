name: Draw keymap

on:
  push:
    paths:
      - "config/silakka54.keymap"
      - "config/silakka54.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draw:
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@main
    with:
      output_folder: keymap-drawer
      json_path: config
